name: Release

# Publishes to npm via OIDC trusted publishing — no token stored in the repo,
# and no 2FA prompt. Requires a trusted publisher configured at
# npmjs.com → package → Settings → Trusted Publisher, pointing at this
# repository and this workflow filename (release.yml).
#
# Cutting a release is then: npm version patch && git push --follow-tags

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; the bundled npm is older.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test

      - run: npm publish --access public
